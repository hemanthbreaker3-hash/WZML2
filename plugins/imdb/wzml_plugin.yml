name: imdb
version: "1.0.1"
author: HTR-X / WZML-X
description: Search IMDb and TMDb for movies and TV titles
license: MIT
repository: https://github.com/SilentDemonSD/WZML-X
tags: [media, lookup]
entry: imdb.py
python_dependencies:
  - imdbio
  - pycountry
  - niquests
commands:
  - name: imdb
    handler: imdb_search
    description: "[query] or ttxxxxxx Get IMDb info"
    usage: "/imdb <query|ttxxxxxxx>"
    access: authorized_uset
  - name: tmdb
    handler: tmdb_search
    description: "[query] Search TMDb for movie or TV information"
    usage: "/tmdb <title>"
    access: authorized_uset
callbacks:
  - pattern: "^imdb"
    handler: imdb_callback
    description: IMDb result navigation
    access: authorized_uset
